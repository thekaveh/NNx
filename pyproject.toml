[build-system]
# >=77: PEP 639 SPDX license metadata below. "wheel" is auto-provided.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
release = [
    "setuptools==84.0.0",
    "wheel==0.48.0",
    "twine==7.0.0",
]
docs-publish = [
    "cairosvg==2.9.1",
    "markdown==3.10.3",
    "pyyaml==6.0.3",
]

[project]
name = "thekaveh-nnx"
# 0.2.0: the dated CHANGELOG [0.1.0] section (2026-05-18 baseline, never
# tagged or published) already claims 0.1.0; the first real release must
# ship the [Unreleased] content under a fresh number.
version = "0.3.0"
description = "Lightweight PyTorch training/eval/visualization toolkit"
readme = "PYPI_README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Kaveh Razavi", email = "kaveh.razavi@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "pytorch", "deep-learning", "graph-neural-networks", "training",
    "checkpointing", "callbacks", "experiments", "reproducibility",
    "neural-networks", "research",
    # Megamerge subsystems (PRs #29–#37) — surfaced here for PyPI
    # discoverability now that the package ships these as first-class
    # entry points rather than thekaveh/ml internals.
    "quantization", "language-model", "transformer", "lora", "peft",
    "diffusion", "knowledge-distillation", "embeddings", "rag",
    "pruning", "model-surgery", "onnx", "gguf",
    # Additional subsystems flagged by the post-#49 overnight-maintenance
    # audit as missing from PyPI keywords despite being first-class
    # entry points in nnx.* (see [PyPI keywords with features] convention).
    "qat", "huggingface", "safetensors", "ollama",
    "self-supervised-learning", "jepa", "vision-transformer", "dpo", "moe",
    # Post-#51 overnight-maintenance pass — three more first-class
    # entry points that shipped without matching PyPI keywords:
    # `nnx.lr_finder` (PR #35), `nnx.trainer.Trainer` multi-optim
    # composite (PR #46), and the cross-cutting Builder pattern
    # (`<Class>.builder()` on every params dataclass, PRs #43-#46, #48).
    "learning-rate-finder", "multi-optimizer", "builder-pattern",
    # Post-#54 overnight-maintenance pass — nnx.viz (six model-internals
    # primitives + Captum attribution) had no matching keyword.
    "visualization", "explainability",
    # FEAT-029: nnx.compilation / nnx.benchmarking.
    "torch-compile", "profiling",
    # FEAT-030: nnx.distributed.
    "ddp", "distributed-training",
    # FEAT-033: nnx.search.
    "hyperparameter-search", "optuna",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Floor = the oldest torch the full core test suite passes on (FIX-011,
    # verified 2026-09-22 on CPU): 2.3 lacks `torch.is_autocast_enabled(
    # device_type)`, rejects float SDPA masks whose dtype differs from a
    # half/bf16/double query, and its `torch.load(weights_only=True)`
    # allowlist cannot read the training-state sidecar. See
    # docs/external-contracts.md "PyTorch support matrix" and the CI
    # `floor-deps` lane, which installs exactly this pair. The vision,
    # graph and plotting stacks are extras (FEAT-031), below.
    "torch>=2.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "prettytable>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "filelock>=3.13",
]
# Removed from `dependencies`:
#   * `scipy` — not imported anywhere in src/tests/examples; still
#     installed transitively via scikit-learn.
#   * `kaleido` — plotly's static-image export backend. We never call
#     `fig.write_image` / `fig.to_image`; only `fig.show()` which needs
#     no kaleido. Users who want static export can `pip install kaleido`.
[project.optional-dependencies]
# Domain extras (FEAT-031): `import nnx` loads none of these, and a feature
# that needs one raises an ImportError naming its extra. `vision` keeps
# FIX-011's pairing of one torchvision minor per torch minor (torch 2.4 <->
# torchvision 0.19). `domains` installs all three — the pre-0.4 core.
vision = ["torchvision>=0.19"]   # NNDataset (torchvision datasets)
graph = ["torch_geometric>=2.4"] # graph nets, NNGraphDataset, nnx.graph_tasks, nnx.link_tasks
plots = ["plotly>=5.18"]         # VisUtils, nnx.lr_finder, the NNRun chart
domains = ["thekaveh-nnx[vision,graph,plots]"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Pinned upper bound: ruff regularly adds new lint/format rules
    # between minor versions; without a ceiling, a fresh `pip install -e
    # .[dev]` six months from now can fail CI on rules that didn't
    # exist when the codebase was written.
    "ruff>=0.6,<0.17",
    "pyright>=1.1.380",    # CI runs `pyright --warnings`; pin here so locals match
    "pre-commit>=3.7,<5",
    "pip-audit==2.10.1",
    "tensorboard>=2.15",   # exercises TensorBoardCallback path in tests
    "onnx>=1.15",          # exercises NNModel.to_onnx in tests
    # Runs exported graphs against the CPU model in tests (FEAT-006); 1.24+
    # ships no CPython 3.10 wheels.
    "onnxruntime>=1.17,<1.24; python_version < '3.11'",
    "onnxruntime>=1.17; python_version >= '3.11'",
]
tensorboard = ["tensorboard>=2.15"]
notebook = ["ipython>=8.0"]
wandb = ["wandb>=0.16"]
onnx = ["onnx>=1.15"]
# `onnx-dynamo` pulls `onnxscript`, required only when calling
# `NNModel.to_onnx(..., dynamo=True)` to dispatch through PyTorch's new
# `torch.export`-based ONNX exporter. The legacy TorchScript path
# (the default) needs only `thekaveh-nnx[onnx]`.
onnx-dynamo = ["onnx>=1.15", "onnxscript>=0.1"]
# `onnx-runtime` executes exported graphs in ONNX Runtime on CPU — the
# export conformance profiles (`nnx.export_conformance`,
# `scripts/check_export_conformance.py`, FEAT-038). 1.24+ ships no CPython
# 3.10 wheels; 1.18 is the first to load the dynamo exporter's IR-10 models.
# Add `onnx-dynamo` for the dynamo-exporter profile.
onnx-runtime = [
    "onnx>=1.15",
    "onnxruntime>=1.18,<1.24; python_version < '3.11'",
    "onnxruntime>=1.18; python_version >= '3.11'",
]
# `viz` covers the core model-internals viz primitives (summary +
# weight_histogram + activation_map + Captum attribution). `viz-interactive`
# adds the Netron browser viewer used by `nnx.viz.netron_export(..., launch=True)`.
# The ONNX file itself comes from `torch.onnx.export` (legacy path) and needs
# only `thekaveh-nnx[onnx]`; `netron` ships a Flask viewer that runs as a separate
# process, kept opt-in so notebook users who just want the `.onnx` artifact
# don't install it.
viz = ["torchinfo>=1.8.0", "captum>=0.7.0", "plotly>=5.18"]  # the figures are Plotly
viz-interactive = ["netron>=7.0"]
quantize = ["torchao>=0.17"]
# `hub` enables interop with the HuggingFace ecosystem:
#   - safetensors as an opt-in checkpoint format (NNCheckpoint.to_file(format="safetensors"))
#   - PyTorchModelHubMixin on NNModel (save_pretrained / push_to_hub / from_pretrained)
# Both deps are runtime-import-guarded — `pip install thekaveh-nnx` works without them.
hub = [
    "safetensors>=0.7.0",
    "huggingface_hub>=1.4.0",
]
embeddings = [
    # The FAISS index is the handoff format to every downstream RAG
    # stack (LangChain / LlamaIndex / Haystack / raw). `sentence-transformers`
    # is the dominant backbone source; users can swap in their own
    # ``nn.Module`` encoder if they don't want the dep.
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.7",
]
# Decoder-only LM path: HF Rust BPE tokenizer + the example dataset
# loader. Kept opt-in so users on the FeedFwd / GNN path don't pull
# a multi-MB Rust binary they'll never call.
lm = [
    "tokenizers>=0.20",
    "datasets>=2.20",
]
# GGUF write path: ``nnx.interop.gguf.write_gguf`` + the Ollama
# Modelfile bundle exporter. The ``gguf`` package is the upstream
# llama-cpp-maintained Python writer — pulling it in only when the
# user actually exports, since most NNx users never leave the
# PyTorch / safetensors world.
gguf-write = [
    "gguf>=0.19.0",
]
# `jev` adapts typed decisions (`nnx.decisions.JevProvider`, FEAT-010) to
# Jev models through the TypeSafe Python SDK. The pin is the range the
# adapter is tested against; the SDK owns transport and retries.
jev = ["typesafe-sdk>=0.7,<0.8"]
# Budgeted experiment search (FEAT-033): nnx.search drives an Optuna study;
# `import nnx` never imports it.
optuna = ["optuna>=4.0,<6"]
docs = [
    "cairosvg==2.9.1",
    "mkdocs>=1.5,<2",
    "mkdocs-material>=9.5",
    # Keep a ceiling so docs rendering remains reproducible across
    # Pygments formatter changes; 2.20.0 includes the current security fix.
    "Pygments<2.22",
]

[project.urls]
Homepage = "https://github.com/thekaveh/NNx"
Repository = "https://github.com/thekaveh/NNx"
Documentation = "https://thekaveh.github.io/NNx/"
Changelog = "https://github.com/thekaveh/NNx/blob/main/CHANGELOG.md"
Issues = "https://github.com/thekaveh/NNx/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: the `py.typed` marker must be packaged inside the `nnx`
# wheel so downstream consumers' type-checkers (pyright / mypy) see
# this distribution as type-checked. setuptools includes non-Python
# files only when listed here.
nnx = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/F/W catch core style + pyflakes errors. B adds bugbear (mutable defaults,
# common foot-guns). I keeps imports ordered. UP nudges toward modern Python
# 3.10+ syntax.
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "E501",  # line too long — large library, gradual cleanup
    "E701",  # multiple statements on one line (colon) — keep `case X: return Y` style
    "E731",  # lambda assignment
    "E741",  # ambiguous var name (e.g., `l`)
    "B008",  # function calls in argument defaults — dataclass field defaults are fine here
    "B024",  # ABC with no abstract methods — NNDatasetBase is a structural base
    "UP007", # Optional[X] vs X | None — keep Optional for readability
    "UP045", # Optional[X] vs X | None in annotations (same as UP007)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    # Upstream deprecations we can't act on — silenced so pytest output
    # stays focused on nnx-relevant warnings.
    "ignore:`torch_geometric.distributed` has been deprecated:DeprecationWarning",
    # `torch.jit.script` is fired transitively by `torch.onnx.export`'s
    # legacy TorchScript path (and by some torchvision / pyg transforms).
    # No first-party `torch.jit.script` usage in nnx; this filter exists
    # purely to keep pytest output focused on nnx-relevant warnings.
    "ignore:`torch.jit.script` is deprecated:DeprecationWarning",
    # `torch.onnx.export` legacy TorchScript path emits a DeprecationWarning
    # in torch >= 2.8. Switching to the dynamo-based exporter requires the
    # `onnxscript` dep — tracked separately; for now we keep the legacy path
    # and silence the noise so pytest output stays focused.
    "ignore:You are using the legacy TorchScript-based ONNX export.*:DeprecationWarning",
    "ignore:The feature will be removed.*:DeprecationWarning:torch.onnx",
]
