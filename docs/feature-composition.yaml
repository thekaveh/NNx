    rationale: Asserts a new session over the resumed net and the compile record.
    status: verified
  - id: CR-03
    group: checkpoint-resume
    features: [DDP, resume, rank RNG]
    entry_point: NNModel.train(distributed=DDP())
    profile: {device: cpu, dtype: fp32, dependencies: [torch.distributed gloo]}
    expected: Two epochs equal one plus a same-world resume, each rank's RNG included.
    tests:
      - tests/test_ddp_resume.py::test_two_epochs_equal_one_plus_a_resume
    rationale: Weights, records and RNG compared per rank.
    status: verified
  - id: CR-04
    group: checkpoint-resume
    features: [stop at an update boundary, LAST checkpoint]
    entry_point: ctx.stop_at_update
    profile: {device: cpu, dtype: fp32, dependencies: [optuna]}
    expected: A mid-epoch stop leaves LAST, its tensors and the history at the previous committed epoch.
    tests:
      - tests/test_search.py::test_a_mid_epoch_stop_leaves_the_last_commit_unrelabelled
    rationale: Compares LAST's tensors with the epoch-0 snapshot.
    status: verified
  - id: CR-05
    group: checkpoint-resume
    features: [on_train_end mutation, LAST refresh]
    entry_point: Callback.on_train_end
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: LAST holds the post-on_train_end weights; BEST keeps the training-time state.
    tests:
      - tests/test_train_end_checkpoint.py::test_last_checkpoint_contains_on_train_end_mutation
      - tests/test_train_end_checkpoint.py::test_best_checkpoint_stays_pre_mutation
    rationale: Reads both checkpoints back.
    status: verified
  - id: CR-06
    group: checkpoint-resume
    features: [DDP, changed world size or partition]
    entry_point: NNModel.train(distributed=DDP(), resume)
    profile: {device: cpu, dtype: fp32, dependencies: [torch.distributed gloo]}
    expected: Refused before anything is restored.
    tests:
      - tests/test_ddp_resume.py::test_a_changed_world_or_partition_fails_before_anything_is_restored
    rationale: Executed negative test; weights asserted unchanged.
    status: unsupported
  - id: CR-08
    group: checkpoint-resume
    features: [DDP, corrupted resume point]
    entry_point: NNModel.train(distributed=DDP(), resume)
    profile: {device: cpu, dtype: fp32, dependencies: [torch.distributed gloo]}
    expected: The writer rank alone verifies the point; a corrupted one is refused on every rank with the same reason, before anything is restored.
    tests:
      - tests/test_ddp_resume.py::test_a_corrupted_resume_point_is_refused_on_every_rank_naming_the_reason
    rationale: Executed two-rank negative test (one flipped byte); per-rank verify and hash counts and unchanged weights asserted.
    status: unsupported
  - id: MT-01
    group: model-transformations
    features: [torch.compile, QAT (topology-changing callback)]
    entry_point: NNModel.train(compile=..., callbacks=[QATLifecycleCallback()])
    profile: {device: cpu, dtype: fp32, dependencies: [torchao]}
    expected: Refused before the first batch, no run reserved.
    tests:
      - tests/test_compile_execution.py::test_a_topology_changing_callback_is_refused_before_the_first_batch
    rationale: Executed negative test.
    status: unsupported
  - id: MT-02
    group: model-transformations
    features: [torch.compile, checkpoint keys, eager reload]
    entry_point: NNModel.train(compile=CompileSpec())
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: Checkpoints hold the eager module's keys (no _orig_mod.) and reload eagerly with identical logits.
    tests:
      - tests/test_compile_execution.py::test_checkpoints_hold_eager_keys_and_reload_eagerly
    rationale: Asserts keys and logits.
    status: verified
  - id: MT-03
    group: model-transformations
    features: [model surgery (deepen), FeedFwdNN]
    entry_point: nnx.surgery.deepen
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: Deepening preserves the network's function.
    tests:
      - tests/test_surgery_deepen.py::test_deepen_preserves_function_on_feed_fwd_nn
    rationale: Outputs compared before and after.
    status: verified
  - id: MT-04
    group: model-transformations
    features: [DDP, batch normalization]
    entry_point: NNModel.train(distributed=DDP())
    profile: {device: cpu, dtype: fp32, dependencies: [torch.distributed gloo]}
    expected: Refused on every rank before any run (running statistics would differ per rank).
    tests:
      - tests/test_ddp_adapter.py::test_preflight_refusals_fail_on_every_rank_before_any_run
    rationale: Executed negative test (among the preflight refusals).
    status: unsupported
  - id: MT-05
    group: model-transformations
    features: [torch.compile, custom train step or non-FP32 precision]
    entry_point: NNModel.train(compile=CompileSpec(), train_step_fn=... | precision=bf16)
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: Refused up front; compile covers the built-in train step in FP32 on built-in non-graph nets.
    tests:
      - tests/test_compile_execution.py::test_out_of_scope_requests_are_refused_up_front
    rationale: Executed negative test; each refusal's type and message are asserted.
    status: unsupported
  - id: IE-01
    group: inference-export
    features: [KV-cache generation, full forward]
    entry_point: GenerativeNNModel.generate
    profile: {device: cpu, dtype: fp32, dependencies: [tokenizers]}
    expected: Cached and uncached generation produce the same output.
    tests:
      - tests/test_generative_nn_model.py::test_kv_cache_produces_same_output_as_full_forward
    rationale: Token-level comparison.
    status: verified
  - id: IE-02
    group: inference-export
    features: [ordered logits pipeline, KV cache]
    entry_point: GenerativeNNModel.generate(logits_pipeline=...)
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: A pipeline equals the explicit processor list, cached and uncached.
    tests:
      - tests/test_ordered_logits_pipeline.py::test_generate_with_a_pipeline_equals_the_explicit_processor_list
    rationale: Seeded outputs compared under both cache modes.
    status: verified
  - id: IE-03
    group: inference-export
    features: [ONNX export, module modes, gradients]
    entry_point: NNModel.to_onnx
    profile: {device: cpu, dtype: fp32, dependencies: [onnx, onnxscript]}
    expected: Export leaves parameters, gradients and mixed train/eval modes unchanged.
    tests:
      - tests/test_inference_helpers_preserve_training_mode.py::test_to_onnx_keeps_parameters_gradients_and_mixed_modes
    rationale: Asserts module modes and parameter identity after export.
    status: verified
  - id: IE-04
    group: inference-export
    features: [predict, training mode]
    entry_point: NNModel.predict
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: predict restores the caller's training mode, also after an exception.
    tests:
      - tests/test_inference_helpers_preserve_training_mode.py::test_predict_restores_training_mode_after_call
      - tests/test_inference_helpers_preserve_training_mode.py::test_predict_restores_training_mode_after_exception
    rationale: Module modes asserted after the call.
    status: verified
  - id: IE-05
    group: inference-export
    features: [ONNX Runtime execution, both exporters]
    entry_point: nnx.export_conformance
    profile: {device: cpu, dtype: fp32, dependencies: [onnxruntime]}
    expected: Executed logits match the native model.
    tests:
      - tests/test_export_conformance.py::test_both_exporters_match_native_logits_in_onnx_runtime
    rationale: Owned by the dedicated export-conformance job (FEAT-038); this matrix does not certify ONNX Runtime parity on the CPU lane.
    status: unverified
  - id: IE-06
    group: inference-export
    features: [torch.compile, bounded benchmarks]
    entry_point: nnx.benchmarking.compare_compile
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: The eager and compiled sides start from identical weights and leave the caller's module unchanged; the compiled first call carries the compile cost, apart from warmed latency.
    tests:
      - tests/test_benchmarking.py::test_compare_compile_starts_both_sides_from_identical_weights
      - tests/test_benchmarking.py::test_compiled_first_call_carries_the_compile_cost
    rationale: Weight digests, outputs and the caller's state and mode are asserted; the first call is recorded apart from the warmed calls.
    status: verified
  - id: DR-01
    group: decisions-results
    features: [Jev provider, decision jobs]
    entry_point: nnx.decisions.jev + DecisionJob
    profile: {device: cpu, dtype: fp32, dependencies: [typesafe_sdk, httpx2]}
    expected: A provider failure crossing a decision job surfaces as the job's typed cause with its request id; the job's questions share one request and nothing is retried; a sync-only client runs one call at a time.
    tests:
      - tests/test_decision_jev.py::test_a_failure_crossing_a_decision_job_keeps_its_reason_and_request_id
      - tests/test_decision_jev.py::test_a_sync_only_injection_is_sync_only_and_a_job_runs_it_one_call_at_a_time
    rationale: A recording client answers 429 through the real adapter; the cause type, request id and call count are asserted.
    status: verified
  - id: DR-02
    group: decisions-results
    features: [Jev provider, decision benchmark]
    entry_point: nnx.decisions.jev + decision benchmark collector
    profile: {device: cpu, dtype: fp32, dependencies: [typesafe_sdk, httpx2]}
    expected: A provider failure crossing a benchmark collection keeps its typed reason and request id.
    tests:
      - tests/test_decision_jev.py::test_a_failure_crossing_a_benchmark_keeps_its_reason_and_request_id
    rationale: Every collected record is failed with the typed reason and request id; one call, no retry.
    status: verified
  - id: DR-03
