    features: [Result boundaries, decision providers]
    entry_point: nnx.result
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: A provider failure becomes an Err keeping its cause and request id, a malformed answer Err("invalid_decision_response") for any provider; an abstention is a success; other exceptions propagate.
    tests:
      - tests/test_result_boundaries.py::test_a_provider_failure_is_an_err_keeping_its_cause_and_request_id
      - tests/test_result_boundaries.py::test_a_malformed_answer_is_an_invalid_response_err_whatever_the_provider
      - tests/test_result_boundaries.py::test_abstention_is_a_success_with_probabilities_and_reasons
      - tests/test_result_boundaries.py::test_other_provider_exceptions_propagate
    rationale: The Result variant and its fields are asserted.
    status: verified
  - id: DR-04
    group: decisions-results
    features: [Result boundaries, run bundles]
    entry_point: nnx.result + run bundle inspection
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: Inspecting a bundle never unpickles; a malformed bundle keeps its code, path and cause through composition.
    tests:
      - tests/test_result_boundaries.py::test_inspecting_a_bundle_never_reaches_torch_load
      - tests/test_result_boundaries.py::test_a_malformed_bundle_keeps_code_path_and_cause_through_composition
    rationale: A fixture makes any unpickling fail; the composed error's fields are asserted.
    status: verified
