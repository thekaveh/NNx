    entry_point: examples/decision_model_pilot.py
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: The pilot's model registers through register_model_factory with no new Nets member and reconstructs from its checkpoint with candidate-aligned records.
    tests:
      - tests/test_decision_model_pilot.py::test_the_recipe_registers_through_feat_006_without_a_new_nets_member
      - tests/test_decision_model_pilot.py::test_the_checkpoint_reconstructs_with_candidate_aligned_records_and_identities
