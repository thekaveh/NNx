    features: [Jev provider, Result boundaries]
    entry_point: nnx.result.decide_result(JevProvider(...), ...)
    profile: {device: cpu, dtype: fp32, dependencies: [typesafe_sdk, httpx2]}
    expected: Each typed Jev failure becomes Err("provider_failure") and a malformed answer Err("invalid_decision_response"), both keeping the cause and request id; a success is Ok with candidate-aligned results.
