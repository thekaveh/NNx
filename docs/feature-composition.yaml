    entry_point: examples/decision_model_pilot.py (ComputeCap)
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: The cap is never exceeded; a capped first epoch produces no checkpoint; exhaustion records a stop and keeps the artifacts.
    tests:
      - tests/test_decision_model_pilot.py::test_the_cap_is_never_exceeded_and_a_capped_first_epoch_produces_no_checkpoint
