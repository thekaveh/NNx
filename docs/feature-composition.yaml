    entry_point: examples/decision_model_pilot.py --empirical
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: The empirical mode reports blocked (no licensed held-out corpus) even with every resource present; no empirical claim is made.
    tests:
      - tests/test_decision_model_pilot.py::test_the_empirical_mode_with_every_resource_present_still_reports_blocked
    rationale: Executed negative test of the documented no-go (docs/decision-model-pilot.md).
    status: unsupported
  - id: DR-08
