# Feature-composition registry (FEAT-039).
#
# Each scenario states which features are combined, through which entry
# point, on which device / dtype / dependency profile, what the expected
# boundary is, and the pytest node ids whose execution is the evidence.
# `status` is the expectation:
#   verified    - the listed tests assert the combined behaviour and must pass
#                 (setup, call and teardown) on the profile; a skip, an xfail
#                 or an import never counts.
#   unsupported - the combination is refused: the tests are the executed
#                 negative tests (or `limitation` cites the exact documented
#                 limitation when no test can exercise it).
#   unverified  - claimed by neither: no executed evidence on the profiles CI
#                 runs (e.g. CUDA AMP on a CPU runner).
# Evidence (which tests passed, at which source digest, on which profile) is
# stored apart: a run's JSON report (the CI `feature-composition-report`
# artifact), rendered into docs/feature-composition.md by
# scripts/check_feature_composition.py.
version: 1
# The profile whose evidence the published page shows (the CI docs job); a
# run missing one of these dependencies fails rather than losing coverage.
evidence_profile:
  os: linux
  python: "3.12"
  device: cpu
  dependencies: [optuna, onnx, onnxscript, onnxruntime, torchao, tensorboard, safetensors, typesafe_sdk, httpx2, tokenizers]
groups:
  training-controls: Training controls
  checkpoint-resume: Checkpoint and resume
  model-transformations: Model transformations
  inference-export: Inference and export
  decisions-results: Decisions and typed results
  packaging: Packaging and optional domains
scenarios:
  - id: TC-01
    group: training-controls
    features: [gradient accumulation, trailing partial window]
    entry_point: NNModel.train
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: Steps only at window ends; a trailing partial window steps once at the epoch boundary.
    tests:
      - tests/test_pass2_f_series.py::test_f2_accumulate_grad_batches_steps_trailing_partial_cycle
    rationale: Exact step counts under accumulation, asserted on the optimizer.
    status: verified
  - id: TC-02
    group: training-controls
    features: [update cap, gradient accumulation, budgeted search]
    entry_point: nnx.search.search
    profile: {device: cpu, dtype: fp32, dependencies: [optuna]}
    expected: An update cap of 2 with accumulate_grad_batches=3 allows no third committed step; a partial window is no update.
    tests:
      - tests/test_search.py::test_an_update_cap_binds_and_a_partial_window_is_no_update
    rationale: Counts real optimizer steps under the cap.
    status: verified
  - id: TC-03
    group: training-controls
    features: [early stopping, stateful resume]
    entry_point: NNModel.train + EarlyStopping
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: A resumed run's restored patience stops training at the epoch the uninterrupted run stopped at.
    tests:
      - tests/test_component_resume.py::test_restored_patience_stops_at_the_uninterrupted_epoch
    rationale: Trains both paths and asserts the stopping epoch.
    status: verified
  - id: TC-04
    group: training-controls
    features: [DDP, gradient accumulation, uneven ignore_index, validation]
    entry_point: NNModel.train(distributed=DDP())
    profile: {device: cpu, dtype: fp32, dependencies: [torch.distributed gloo]}
    expected: Two ranks equal one process on the union batch (updates and globally weighted records).
    tests:
      - tests/test_ddp_adapter.py::test_two_ranks_match_the_global_batch_reference
    rationale: Parity against a single-process reference at rtol 1e-6.
    status: verified
  - id: TC-05
    group: training-controls
    features: [finalize_step paradigm steps, gradient accumulation]
    entry_point: nnx._step_helpers.finalize_step
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: Refused with a ValueError (accumulation is not handled by the imperative paradigm steps).
    tests:
      - tests/test_step_helpers.py::test_finalize_step_raises_on_gradient_accumulation
    rationale: Executed negative test.
    status: unsupported
  - id: TC-06
    group: training-controls
    features: [FP16 automatic mixed precision, CUDA]
    entry_point: NNModelParams(precision=PrecisionPolicy("fp16"))
    profile: {device: cuda, dtype: fp16, dependencies: [cuda]}
    expected: Trains through a GradScaler on CUDA.
    tests: []
    rationale: The CPU runners cannot execute CUDA AMP and no test trains it on a real GPU; no claim without one.
    status: unverified
  - id: TC-07
    group: training-controls
    features: [DDP, torch.compile]
    entry_point: NNModel.train(distributed=DDP(), compile=CompileSpec())
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: Refused on every rank before any run starts.
    tests:
      - tests/test_ddp_adapter.py::test_preflight_refusals_fail_on_every_rank_before_any_run
    rationale: Executed two-rank negative test; the refusal message is asserted on both ranks and no run directory is created.
    status: unsupported
  - id: TC-08
    group: training-controls
    features: [DDP, HistoryJournal]
    entry_point: NNModel.train(distributed=DDP(), history=HistoryJournal(...))
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: Refused on every rank before any run starts; DDP keeps the eager history.
    tests:
      - tests/test_ddp_adapter.py::test_preflight_refusals_fail_on_every_rank_before_any_run
    rationale: Executed two-rank negative test; the refusal message is asserted on both ranks and no run directory is created.
    status: unsupported
  - id: TC-09
    group: training-controls
    features: [DDP, budgeted search, experiment plans]
    entry_point: nnx.search.search / ExperimentPlan.fit under torchrun
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: Refused on every rank of a multi-rank group before any study, factory call or run; a one-rank group behaves as no group.
    tests:
      - tests/test_ddp_adapter.py::test_single_process_entry_points_refuse_a_multi_rank_group
      - tests/test_ddp_adapter.py::test_single_process_entry_points_run_in_a_one_rank_group
    rationale: Executed two-rank negative test (refusal message, no study, factory call or run on any rank) and a one-rank positive control.
    status: unsupported
  - id: CR-01
    group: checkpoint-resume
    features: [warm resume, list loader]
    entry_point: NNTrainParams(resume_from_run_id=...)
    profile: {device: cpu, dtype: fp32, dependencies: []}
    expected: A warm resume equals the uninterrupted run.
    tests:
      - tests/test_train_integration.py::test_warm_resume_list_loader_matches_uninterrupted
