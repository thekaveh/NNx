name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight matrix runs when a new commit lands on the same PR
# (push to main always finishes). Saves runner minutes without
# delaying main-branch CI signal.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Principle of least privilege: CI only needs to read the repo. Override
# at job/step level if a future addition needs more.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint-and-test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Caps a hung pytest run; default is 6 hours on GitHub-hosted runners.
    # The suite runs on every core (pytest -n auto, FIX-031); serially it took
    # ~19 min on the slowest leg (3.11, with coverage).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install diagram rendering runtime
        run: sudo apt-get update && sudo apt-get install --yes libcairo2

      - name: Install uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
          version: "0.12.3"

      - name: Sync package from the frozen lock
        # Every optional-dep extra is installed so the tests that gate on
        # `pytest.importorskip(...)` for {hub, viz, viz-interactive,
        # quantize, tensorboard, wandb, onnx, onnx-dynamo, onnx-runtime,
        # embeddings, lm, gguf-write} actually exercise the code path in CI instead
        # of silently skipping. Without this, a broken import in a new
        # sub-project would ship to PyPI undetected. Keep this list in
        # sync with pyproject.toml [project.optional-dependencies] and
        # with release.yml's install line.
        run: |
          uv sync --frozen --all-extras --python "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Lint with ruff
        run: uv run --frozen ruff check src/ tests/ examples/ scripts/

      - name: Check formatting with ruff
        # Matches the `ruff-format` hook in .pre-commit-config.yaml so
        # contributors running pre-commit don't see CI accepting code
        # that pre-commit would reformat.
        run: uv run --frozen ruff format --check src/ tests/ examples/ scripts/

      - name: Type-check with pyright
        # The package publishes py.typed, so errors and warnings are gating.
        run: uv run --frozen pyright --warnings

      - name: Run pytest
        env:
          NNX_TQDM_DISABLE: "1"
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          if [[ "$PYTHON_VERSION" == "3.11" ]]; then
            uv run --frozen pytest -n auto --cov=nnx --cov-report=term-missing --cov-report=xml
          else
            uv run --frozen pytest -n auto
          fi

      - name: Build docs with mkdocs --strict
        # Surfaces broken cross-doc links and missing nav entries that
        # would otherwise ship to the published site.
        run: |
          uv run --frozen python -m scripts.docs.extract_architecture_svg --check
          uv run --frozen python -m scripts.docs.build_docs
          uv run --frozen mkdocs build --strict --site-dir _site

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  feature-composition:
    # The feature-composition matrix (FEAT-039): every scenario's listed
    # tests run once with a phase-recording plugin; the job fails when a
    # verified row fails or loses coverage, or an unsupported row's negative
    # test does not pass (a skip, an xfail or a setup / teardown failure
    # never counts). The evidence report is kept as an artifact.
    name: feature-composition
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
          version: "0.12.3"

      - name: Sync package from the frozen lock
        run: uv sync --frozen --all-extras --python "3.12"

      - name: Check, run and gate the composition scenarios
        env:
          NNX_TQDM_DISABLE: "1"
        run: uv run --frozen python scripts/check_feature_composition.py --check --run --report feature-composition-report.json

      - name: Upload the evidence report
        if: always()
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: feature-composition-report
          path: feature-composition-report.json
          retention-days: 30

  export-conformance:
    # Executable ONNX export conformance (FEAT-038): both exporters' FP32
    # feed-forward profiles run in ONNX Runtime on CPU and every raw logit
    # is compared with the native model. This job cannot pass by skipping:
    # the core-only step proves `import nnx` needs no runtime and that the
    # check then FAILS with the missing-dependency exit code (10); the
    # conformance tests run with NNX_REQUIRE_ONNX_RUNTIME=1, so a missing
    # runtime fails them; and the script's exit code separates
    # missing-dependency / export / check / hash / load / mismatch /
    # input-contract failures (scripts/check_export_conformance.py).
    # It never uses the dynamo dispatch-error skip fixture and downloads
    # nothing beyond the locked packages.
    name: export-conformance (ONNX Runtime, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
          version: "0.12.3"

      - name: Core import works without the runtime extra
        run: |
          uv sync --frozen --python 3.12
          uv run --frozen --no-sync python - <<'PY'
          import importlib.util
          import nnx
          import nnx.export_conformance
          for name in ("onnx", "onnxruntime", "onnxscript"):
              assert importlib.util.find_spec(name) is None, f"{name} is installed in the core-only environment"
          print("core import ok without onnx / onnxruntime / onnxscript; nnx", nnx.__version__)
          PY

      - name: Without the runtime the check fails (missing-dependency), never skips
        run: |
          set +e
          uv run --frozen --no-sync python scripts/check_export_conformance.py --output missing.json
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 10

      - name: Install only the onnx-runtime and onnx-dynamo extras
        # Without `dev` (which also ships onnx / onnxruntime), so a broken
        # `onnx-runtime` extra fails here.
        run: uv sync --frozen --extra onnx-runtime --extra onnx-dynamo --python 3.12

      - name: Run both conformance profiles
        run: |
          uv run --frozen --no-sync python scripts/check_export_conformance.py \
            --output conformance/conformance.json --artifacts conformance/artifacts

      - name: Add the test tooling
        run: uv sync --frozen --extra onnx-runtime --extra onnx-dynamo --extra dev --python 3.12

      - name: Run the conformance tests (a missing runtime fails, never skips)
        env:
          NNX_REQUIRE_ONNX_RUNTIME: "1"
          NNX_TQDM_DISABLE: "1"
        run: |
          uv run --frozen --no-sync pytest tests/test_export_conformance.py \
            "tests/test_inference_helpers_preserve_training_mode.py::test_to_onnx_keeps_parameters_gradients_and_mixed_modes" \
            tests/test_examples_smoke.py::test_onnx_sample_runtime_conformance \
            tests/test_examples_smoke.py::test_onnx_sample_never_claims_parity_without_the_runtime \
            -p no:cacheprovider -rs -q --junitxml=conformance/pytest.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("conformance/pytest.xml").getroot().find("testsuite")
          skipped = int(suite.get("skipped", 0))
          print("tests:", suite.get("tests"), "skipped:", skipped)
          assert skipped == 0, "a conformance test was skipped"
          PY

      - name: Keep the conformance evidence
        if: always()
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: export-conformance
          path: |
            conformance/
            missing.json
          if-no-files-found: warn
          retention-days: 30

  installed-profiles:
    # FEAT-031: torchvision, torch_geometric and plotly are extras. Each
    # profile installs the built wheel (core, one extra, or the `domains`
    # aggregate) into a clean environment outside the checkout, over the
    # minimum and the current torch pair, and runs
    # scripts/smoke_core_install.py: `import nnx` loads no domain package,
    # py.typed ships, the installed closure holds exactly the profile's
    # domain packages, a tiny model trains / predicts / reloads, installed
    # extras work and absent ones name their extra. The report records the
    # closure and three cold-import timings (no threshold asserted).
    name: installed-profile (${{ matrix.profile }}, ${{ matrix.pair }} torch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [core, vision, graph, plots, domains]
        pair: [floor, current]
        include:
          - pair: floor
            python: "3.10"
            torch: "2.4.1"
            torchvision: "0.19.1"
          - pair: current
            python: "3.12"
            torch: ""
            torchvision: ""
    env:
      PYTHON_VERSION: ${{ matrix.python }}
      DIST_DIR: dist
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
          version: "0.12.3"

      - name: Build the wheel and sdist
        run: uv build --python "$PYTHON_VERSION" --out-dir dist

      - name: Install the profile into a clean environment outside the checkout
        # CPU torch wheels; the floor pins the declared minimum pair
        # (torchvision only where the profile installs the vision extra).
        env:
          PROFILE: ${{ matrix.profile }}
          TORCH_PIN: ${{ matrix.torch }}
          TORCHVISION_PIN: ${{ matrix.torchvision }}
        run: |
          set -euo pipefail
          wheel="$(ls "$DIST_DIR"/*.whl)"
          venv="$RUNNER_TEMP/profile-venv"
          uv venv --python "$PYTHON_VERSION" "$venv"
          pins=()
          if [ -n "$TORCH_PIN" ]; then
            pins+=("torch==$TORCH_PIN")
            case "$PROFILE" in vision|domains) pins+=("torchvision==$TORCHVISION_PIN") ;; esac
          fi
          if [ "$PROFILE" = core ]; then spec="thekaveh-nnx @ file://$wheel"; else spec="thekaveh-nnx[$PROFILE] @ file://$wheel"; fi
          uv pip install --python "$venv/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match "${pins[@]}" "$spec"
          cp scripts/smoke_core_install.py "$RUNNER_TEMP/"

      - name: Run the installed-artifact smoke (PYTHONPATH unset)
        env:
          NNX_TQDM_DISABLE: "1"
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/profile-venv/bin/python" smoke_core_install.py \
            --profile "${{ matrix.profile }}" --output "profile-${{ matrix.profile }}-${{ matrix.pair }}.json"

      - name: Run examples 01 and 25 on the core wheel and the core sdist
        if: matrix.profile == 'core'
        env:
          NNX_TQDM_DISABLE: "1"
        run: |
          set -euo pipefail
          sdist_venv="$RUNNER_TEMP/sdist-venv"
          uv venv --python "$PYTHON_VERSION" "$sdist_venv"
          pins=()
          if [ -n "${{ matrix.torch }}" ]; then pins+=("torch==${{ matrix.torch }}"); fi
          uv pip install --python "$sdist_venv/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match "${pins[@]}" "$(ls dist/*.tar.gz)"
          for venv in "$RUNNER_TEMP/profile-venv" "$sdist_venv"; do
            for example in 01_synthetic_classification.py 25_conv_classifier.py; do
              workdir="$(mktemp -d)"  # each run writes runs/<id>: a fresh directory per run
              (cd "$workdir" && env -u PYTHONPATH "$venv/bin/python" "$GITHUB_WORKSPACE/examples/$example")
            done
          done

      - name: Upload the profile report
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-profile-${{ matrix.profile }}-${{ matrix.pair }}
          path: ${{ runner.temp }}/profile-*.json
          retention-days: 30

  floor-deps:
    # The frozen lock above validates the *newest* resolution, not the
    # declared dependency floor. This lane installs exactly the minimum
    # torch / torchvision pair from pyproject.toml (CPU wheels, core
    # dependencies plus the `domains` extra — the graph, vision and plotting
    # stacks that were core before FEAT-031 — while extras such as torchao,
    # with their own newer torch requirements, stay absent) and runs the
    # core suite on it (FIX-011). Keep TORCH_FLOOR / TORCHVISION_FLOOR in
    # sync with pyproject.toml and docs/external-contracts.md §2.1;
    # tests/test_train_integration.py asserts the pyproject side.
    # (Static name: the `env` context is not available in a job's `name`.)
    name: floor-deps (torch 2.4.1, Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TORCH_FLOOR: "2.4.1"
      TORCHVISION_FLOOR: "0.19.1"
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        # actions/setup-python@v7.0.0 — 3.10 has wheels for every torch
        # release from the floor to the current lock.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"

      - name: Install the declared minimum torch / torchvision (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${TORCH_FLOOR}" "torchvision==${TORCHVISION_FLOOR}" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install NNx core + domains against the pinned floor
        # The constraints file stops the package install from upgrading
        # torch / torchvision to the newest release on PyPI.
        run: |
          printf 'torch==%s\ntorchvision==%s\n' "$TORCH_FLOOR" "$TORCHVISION_FLOOR" > floor-constraints.txt
          python -m pip install -c floor-constraints.txt -e ".[domains]" "pytest>=7.4"
          python - <<'PY'
          import torch, torchvision, nnx
          print("torch", torch.__version__, "torchvision", torchvision.__version__, "nnx", nnx.__file__)
          assert torch.__version__.startswith("2.4."), torch.__version__
          assert hasattr(torch.amp, "GradScaler")
          PY

      - name: Run the core suite on the floor
        # Docs-projection modules need the docs extras; the Cora parity
        # test downloads data. Everything else runs, with extra-gated tests
        # skipping via importorskip exactly as documented in
        # docs/external-contracts.md §2.1.
        env:
          NNX_TQDM_DISABLE: "1"
        run: |
          python -m pytest tests \
            --ignore=tests/test_docs_projection.py \
            --ignore=tests/test_wiki_projection.py \
            --deselect tests/test_nn_graph_dataset_full_batch.py::test_full_batch_cora_parity \
            -p no:cacheprovider -q
