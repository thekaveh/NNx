name: Release Please

# release-please watches main for Conventional Commits and maintains a
# long-lived "release PR" that bumps the version + updates CHANGELOG.md
# according to what's accumulated since the last tag. Merging that PR
# creates a draft vX.Y.Z release and its tag, then explicitly dispatches the top-level release
# workflow. Trusted PyPI publishing cannot run from a reusable workflow because
# its OIDC and attestation identities would name different workflow files.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # release-please pushes its release branch and opens or updates a PR.
    permissions:
      actions: write # Dispatch required checks for the managed release PR.
      contents: write # Push the managed release branch and tag.
      pull-requests: write # Open or update the managed release PR.
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch required checks for managed release PRs
        # FIX-033: release-please's own commit is the only one on a release
        # PR (it bumps uv.lock's version through extra-files too), so no bot
        # push asks the ruleset for an extra approval. Its GITHUB_TOKEN events
        # trigger no workflow, so the required checks are dispatched here.
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions \
            --json headRefName --jq '.[].headRefName | select(startswith("release-please--"))' |
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            gh workflow run security.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done

      - name: Checkout main for the release notes
        # The push being handled (github.sha), whose CHANGELOG holds the
        # released version's section: no ref taken from an action output.
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish the curated release notes
        # FIX-029: release-please drafts the release from its generated
        # commit list; the curated [Unreleased] notes replace it (folded under
        # the version heading as the post-release sync does, FIX-033).
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          python3 scripts/release/finalize_changelog.py CHANGELOG.md --release-notes "$RELEASE_TAG" > "$RUNNER_TEMP/notes.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Dispatch verified release workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "release_ref=$RELEASE_REF" \
            -f "tag_name=$RELEASE_TAG"
