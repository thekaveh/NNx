name: docs

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "examples/README.md"
      - "tests/README.md"
      - "scripts/docs/**"
      - "pyproject.toml"
      - "requirements-tools.txt"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/check_feature_composition.py"
      - "scripts/composition_plugin.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "examples/README.md"
      - "tests/README.md"
      - "scripts/docs/**"
      - "pyproject.toml"
      - "requirements-tools.txt"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/check_feature_composition.py"
      - "scripts/composition_plugin.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  # Per ref: a pull request's docs run never displaces main's pending deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-26.04
    # The composition scenarios (torchrun DDP included) run here too.
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install diagram rendering runtime
        # A package-mirror stall fails here, not after the whole job budget.
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install --yes libcairo2
      - name: Install docs + feature extras
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
          version: "0.12.3"
      - name: Sync docs + feature extras from the frozen lock
        run: uv sync --frozen --all-extras --python "3.12"
      - name: Render the feature-composition matrix from a fresh report
        # FEAT-039: the scenarios run here, and the page the site and the
        # wiki publish is rendered from this one report (same evidence
        # digest on both); a stale or missing report renders unverified.
        env:
          NNX_TQDM_DISABLE: "1"
        run: |
          uv run --frozen python scripts/check_feature_composition.py --check --run --report feature-composition-report.json
          uv run --frozen python scripts/check_feature_composition.py --render --report feature-composition-report.json
      - name: Keep the evidence report for the wiki job
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: feature-composition-report
          path: feature-composition-report.json
          retention-days: 30
      - name: Build site (strict)
        run: |
          uv run --frozen python -m scripts.docs.extract_architecture_svg --check
          uv run --frozen python -m scripts.docs.build_docs
          uv run --frozen mkdocs build --strict

      - name: Verify deterministic wiki projection
        run: uv run --frozen python -m scripts.docs.build_wiki --check

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # actions/configure-pages@v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # actions/upload-pages-artifact@v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write # Publish the uploaded artifact to GitHub Pages.
      id-token: write # Authenticate the Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy Pages
        # actions/deploy-pages@v5.0.0
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  wiki:
    name: Publish GitHub wiki
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # Push the generated wiki through GITHUB_TOKEN.
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
          version: "0.12.3"

      - name: Sync documentation tooling from the frozen lock
        run: uv sync --frozen --only-group docs-publish --no-install-project --no-build --python "3.12"

      - name: Fetch the build job's evidence report
        # actions/download-artifact@v7.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: feature-composition-report

      - name: Render the feature-composition matrix from that report
        run: uv run --frozen --no-sync python scripts/check_feature_composition.py --render --report feature-composition-report.json

      - name: Build wiki
        run: uv run --frozen --no-sync python -m scripts.docs.build_wiki

      - name: Publish wiki master branch
        env:
          WIKI_REPOSITORY: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: uv run --frozen --no-sync python -m scripts.docs.push_wiki generated/wiki "$WIKI_REPOSITORY"
