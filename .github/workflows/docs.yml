name: docs

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "examples/README.md"
      - "tests/README.md"
      - "scripts/docs/**"
      - "pyproject.toml"
      - "requirements-tools.txt"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/check_feature_composition.py"
      - "scripts/composition_plugin.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "examples/README.md"
      - "tests/README.md"
      - "scripts/docs/**"
      - "pyproject.toml"
      - "requirements-tools.txt"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/check_feature_composition.py"
      - "scripts/composition_plugin.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  # Per ref: a pull request's docs run never displaces main's pending deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gpu-evidence:
    # FEAT-043: the cuda evidence profile (CUDA FP16/BF16 AMP, two-GPU NCCL
    # DDP). Runs only where the repository has registered a self-hosted GPU
    # runner and set the NNX_GPU_RUNNER variable to "true"; otherwise it is
    # skipped and the page shows those rows unverified. A pull request from
    # a fork never runs on the self-hosted machine.
    name: GPU composition evidence
    if: vars.NNX_GPU_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: "0.13.0"
      - name: Sync the feature extras from the frozen lock
        run: uv sync --frozen --all-extras --python "3.12"
      - name: Run and gate the composition scenarios on CUDA
        env:
          NNX_TQDM_DISABLE: "1"
        run: uv run --frozen python scripts/check_feature_composition.py --run --report feature-composition-cuda-report.json
      - name: Keep the cuda evidence report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feature-composition-cuda-report
          path: feature-composition-cuda-report.json
          retention-days: 30

  build:
    name: Build documentation
    # Waits for the GPU evidence when it runs; never blocked by its absence.
    needs: [gpu-evidence]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    # The composition scenarios (torchrun DDP included) run here too.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install diagram rendering runtime
        # A package-mirror stall fails here, not after the whole job budget.
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install --yes libcairo2
      - name: Install docs + feature extras
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: "0.13.0"
      - name: Sync docs + feature extras from the frozen lock
        run: uv sync --frozen --all-extras --python "3.12"
      - name: Fetch the GPU job's cuda evidence report (when it ran)
        # A failed GPU run's report is fetched too, so its failing rows
        # render *failed* rather than *unverified*.
        if: needs.gpu-evidence.result == 'success' || needs.gpu-evidence.result == 'failure'
        # A failed GPU job may have uploaded nothing: a missing report renders
        # the cuda rows unverified, it never blocks the docs build.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feature-composition-cuda-report
      - name: Render the feature-composition matrix from a fresh report
        # FEAT-039: the scenarios run here, and the page the site and the
        # wiki publish is rendered from these reports (same evidence
        # digests on both); a stale or missing report renders unverified.
        # FEAT-043: the cuda report, when present, judges the cuda rows.
        env:
          NNX_TQDM_DISABLE: "1"
        run: |
          uv run --frozen python scripts/check_feature_composition.py --check --run --report feature-composition-report.json
          uv run --frozen python scripts/check_feature_composition.py --render --report feature-composition-report.json --report feature-composition-cuda-report.json
      - name: Keep the evidence report for the wiki job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feature-composition-report
          path: |
            feature-composition-report.json
            feature-composition-cuda-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Build site (strict)
        run: |
          uv run --frozen python -m scripts.docs.extract_architecture_svg --check
          uv run --frozen python -m scripts.docs.build_docs
          uv run --frozen mkdocs build --strict

      - name: Verify deterministic wiki projection
        run: uv run --frozen python -m scripts.docs.build_wiki --check

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write # Publish the uploaded artifact to GitHub Pages.
      id-token: write # Authenticate the Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  wiki:
    name: Publish GitHub wiki
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # Push the generated wiki through GITHUB_TOKEN.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: "0.13.0"

      - name: Sync documentation tooling from the frozen lock
        run: uv sync --frozen --only-group docs-publish --no-install-project --no-build --python "3.12"

      - name: Fetch the build job's evidence report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feature-composition-report

      - name: Render the feature-composition matrix from that report
        run: uv run --frozen --no-sync python scripts/check_feature_composition.py --render --report feature-composition-report.json --report feature-composition-cuda-report.json

      - name: Build wiki
        run: uv run --frozen --no-sync python -m scripts.docs.build_wiki

      - name: Publish wiki master branch
        env:
          WIKI_REPOSITORY: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: uv run --frozen --no-sync python -m scripts.docs.push_wiki generated/wiki "$WIKI_REPOSITORY"
