name: security

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "23 9 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.13.0"

      - name: Sync audit tooling from the frozen lock
        run: uv sync --frozen --all-extras --python "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Audit frozen dependency graph
        run: |
          uv export --frozen --all-extras --all-groups --python "$PYTHON_VERSION" --no-emit-project --no-hashes --output-file frozen-requirements.txt
          # Python 3.10 only: skip the IDs whose fixes need Python >= 3.11 (see the file's header).
          ignores=()
          if [ "$PYTHON_VERSION" = "3.10" ]; then
            while read -r id _; do ignores+=(--ignore-vuln "$id"); done < <(grep -v '^#' .github/pip-audit-py310-ignores.txt)
          fi
          uv run --frozen python -m pip_audit --requirement frozen-requirements.txt --progress-spinner off "${ignores[@]}"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
