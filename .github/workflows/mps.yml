name: MPS

# FEAT-050: the tests marked `mps` on an Apple-silicon MPS device. Its own
# workflow, not a CI job: while NNX_MPS_RUNNER is set and the self-hosted
# runner is offline, a queued run waits for it (up to GitHub's 24-hour queue
# limit), and inside ci.yml that wait would hold the next push's whole CI
# run behind CI's concurrency group.
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer commit on the same ref replaces a queued or running MPS run, so a
# stalled queue holds at most one run, and never another workflow's.
concurrency:
  group: mps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mps-evidence:
    # FEAT-050: the tests marked `mps` (MPS has no float64; the CPU hops and
    # the MPS generator snapshots) on an Apple-silicon MPS device. Every other
    # lane is Linux, where they skip; tests/test_mps_cpu_pins.py pins the
    # same fixes there. Runs only where the repository has registered a
    # self-hosted macOS arm64 runner and set the NNX_MPS_RUNNER variable to
    # "true" (hosted macOS arm64 MPS is unverified: actions/runner-images#9254
    # reports MPS allocation failures); otherwise it is skipped and
    # docs/external-contracts.md §2.1 keeps the MPS row unverified in CI. A
    # pull request from a fork never runs on the self-hosted machine. It
    # cannot pass by skipping: the probe fails without MPS, and the tests
    # run with NNX_REQUIRE_MPS=1, which fails an `mps` test without MPS.
    name: MPS tests (self-hosted Apple silicon)
    if: vars.NNX_MPS_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macos, arm64]
    # Each GPU step waits up to 15 minutes for the shared Mac GPU lock (scripts/with_mac_gpu_lock.py).
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          version: "0.13.9"

      - name: Sync the extras from the frozen lock
        run: uv sync --frozen --all-extras --python "3.12"

      - name: Probe the MPS device (fails without one)
        run: |
          python3 scripts/with_mac_gpu_lock.py -- uv run --frozen --no-sync python - <<'PY'
          import platform, torch
          built, available = torch.backends.mps.is_built(), torch.backends.mps.is_available()
          print("torch", torch.__version__, platform.platform(), "mps built:", built, "available:", available)
          assert built and available, "this runner has no usable MPS device"
          print("mps draw ok:", torch.rand(2, device="mps").cpu().tolist())
          PY

      - name: Run the MPS tests (a missing device fails, never skips)
        env:
          NNX_REQUIRE_MPS: "1"
          NNX_TQDM_DISABLE: "1"
        run: |
          mkdir -p mps-evidence
          python3 scripts/with_mac_gpu_lock.py -- uv run --frozen --no-sync pytest tests -m mps -p no:cacheprovider -rs -q --junitxml=mps-evidence/pytest.xml
          uv run --frozen --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("mps-evidence/pytest.xml").getroot().find("testsuite")
          tests, skipped = int(suite.get("tests", 0)), int(suite.get("skipped", 0))
          print("tests:", tests, "skipped:", skipped)
          assert tests > 0, "no test is marked mps"
          assert skipped == 0, "an MPS test was skipped"
          PY

      - name: Keep the MPS evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mps-evidence
          path: mps-evidence/
          if-no-files-found: warn
          retention-days: 30

  mps-gate-without-mps:
    # FEAT-050 (#572): the hosted-Linux twin of mps-evidence. Hosted Linux has
    # no MPS device, so this is a real run without MPS: the probe must fail,
    # and every `mps` test must fail with the NNX_REQUIRE_MPS message (not
    # skip, not pass). It proves the gate; it runs no MPS result. It needs no
    # runner, so it is not gated on NNX_MPS_RUNNER and runs on every trigger of
    # this workflow.
    name: MPS gate without MPS (hosted Linux, must fail)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install diagram rendering runtime
        # A package-mirror stall fails here, not after the whole job budget.
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install --yes libcairo2

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          version: "0.13.9"

      - name: Sync the extras from the frozen lock
        run: uv sync --frozen --all-extras --python "3.12"

      - name: The probe fails without an MPS device
        run: |
          if uv run --frozen --no-sync python - <<'PY'
          import torch
          assert torch.backends.mps.is_built() and torch.backends.mps.is_available()
          PY
          then
            echo "this runner has an MPS device, so the no-MPS gate cannot run here"
            exit 1
          fi

      - name: The MPS tests fail with the gate message (never skip, never pass)
        env:
          NNX_REQUIRE_MPS: "1"
          NNX_TQDM_DISABLE: "1"
        run: |
          mkdir -p mps-gate
          set +e
          uv run --frozen --no-sync pytest tests -m mps -p no:cacheprovider -rs -q --junitxml=mps-gate/pytest.xml
          status=$?
          set -e
          test "$status" -ne 0 || { echo "the mps tests passed without an MPS device"; exit 1; }
          uv run --frozen --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("mps-gate/pytest.xml").getroot().iter("testcase"))
          gated = [
              case
              for case in cases
              if any("NNX_REQUIRE_MPS=1 and" in (failure.get("message") or "") for failure in case.findall("failure") + case.findall("error"))
          ]
          print("tests:", len(cases), "failed with the gate message:", len(gated))
          assert cases and len(gated) == len(cases), "an mps test skipped, passed, or failed for another reason"
          PY
