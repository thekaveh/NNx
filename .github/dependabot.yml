version: 2
# Security updates ignore every option below, groups included, because each
# ecosystem sets target-branch: each opens ungrouped against the default
# branch, main. A uv security update needs the same hand edits as a uv
# version update (see pinned-tools).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # tests/test_pypi_publication.py pins the setup-uv commit, so a setup-uv
      # bump stays red until that pin is edited by hand. An action joins the
      # first group that matches it, so this group, ahead of the catch-all,
      # keeps the other action bumps from waiting on that edit.
      setup-uv:
        patterns:
          - "astral-sh/setup-uv"
      github-actions:
        patterns:
          - "*"
    target-branch: develop
  # "uv" updates pyproject.toml and uv.lock together ("pip" left the lock
  # behind, so its pull requests tested the old lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Tools pinned in the ledger (docs/external-contracts.md) and in
      # requirements-tools.txt move on their own, so a bump that needs those
      # files updated by hand never holds back the other dependencies. A
      # dependency joins the first group that matches it, so this group comes
      # ahead of the catch-all. A ruff bump also needs the matching pre-commit
      # rev (a joint update). A uv bump needs 14 hand edits:
      # - docs/external-contracts.md: the uv pin of the "Maintenance tooling"
      #   and "Package publishing" rows (2);
      # - .github/workflows: the version input of every astral-sh/setup-uv
      #   step (12: ci.yml 4, docs.yml 3, mps.yml 1, release.yml 3,
      #   security.yml 1).
      pinned-tools:
        patterns:
          - "setuptools"
          - "wheel"
          - "twine"
          - "pip-audit"
          - "ruff"
          - "pyright"
          - "uv"
      python-dependencies:
        patterns:
          - "*"
    target-branch: develop
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    target-branch: develop
