version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    target-branch: develop
  # "uv" updates pyproject.toml and uv.lock together ("pip" left the lock
  # behind, so its pull requests tested the old lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Tools pinned in the ledger (docs/external-contracts.md) and in
      # requirements-tools.txt move on their own, so a bump that needs those
      # files updated by hand never holds back the other dependencies. A
      # ruff bump also needs the matching pre-commit rev (a joint update).
      pinned-tools:
        patterns:
          - "setuptools"
          - "wheel"
          - "twine"
          - "pip-audit"
          - "ruff"
          - "pyright"
      python-dependencies:
        patterns:
          - "*"
    target-branch: develop
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    target-branch: develop
