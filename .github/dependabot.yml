version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    target-branch: develop
  # "uv" updates pyproject.toml and uv.lock together ("pip" left the lock
  # behind, so its pull requests tested the old lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The exact-pinned release tools move on their own, so a bump that
      # needs the ledger (docs/external-contracts.md) updated never holds
      # back the other dependencies.
      release-tools:
        patterns:
          - "setuptools"
          - "wheel"
          - "twine"
          - "pip-audit"
      python-dependencies:
        patterns:
          - "*"
    target-branch: develop
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    target-branch: develop
